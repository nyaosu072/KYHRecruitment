<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한일 채용공고 모아보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f5f6f4; --panel:#fff; --fg:#1d2420; --muted:#5f6b64; --line:#d9dfdb;
  --accent:#1f6f54; --accent-fg:#fff; --kr:#2b5bb5; --jp:#b8323a; --warn:#b26a00;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --panel:#1c2320; --fg:#e6ebe8; --muted:#9aa7a0; --line:#2e3833;
  --accent:#4fbf93; --accent-fg:#0d1a14; --kr:#7ea4ee; --jp:#f08088; --warn:#f0b35a; color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.topright{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.contact{color:var(--muted);text-decoration:none}
.contact:hover{color:var(--accent);text-decoration:underline}
.lang a{color:var(--muted);text-decoration:none;padding:0 2px}
.lang a[aria-current]{color:var(--fg);font-weight:700}
.lang a:hover{color:var(--accent)}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;position:sticky;top:12px;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box}
@media (max-width:800px){form{position:static;max-height:none!important;overflow:visible}}
.fhead{display:flex;justify-content:space-between;align-items:center}
.fhead b{font-size:.95rem}
.fhead button{font:inherit;font-size:.82rem;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
.fhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.folded>:not(.fhead){display:none}
/* 접으면 왼쪽 칸을 버튼 크기로 줄이고 공고 목록을 넓게 */
.grid.folded{grid-template-columns:auto minmax(0,1fr)}
form.folded{padding:6px;overflow:visible;max-height:none!important}
form.folded .fhead{justify-content:center}
form.folded .fhead b{display:none}
@media (max-width:800px){.grid.folded{grid-template-columns:1fr} form.folded{justify-self:start}}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:0;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.88rem}
.seg input:checked+label{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.err{color:var(--warn);font-size:.85rem;margin:0 0 10px}
ul.jobs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.job a{color:var(--fg);font-weight:600;text-decoration:none}
.job a:hover{text-decoration:underline}
.job a:focus-visible{outline:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:.85rem}
.tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.kr{color:var(--kr)} .jp{color:var(--jp)} .dl{color:var(--warn)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px}
.pager button{min-width:36px;padding:6px 10px;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
.pager button[aria-current]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 data-t="title"></h1>
    <span class="topright"><span class="lang"><a href="?lang=ko" data-lang="ko">한국어</a> | <a href="?lang=en" data-lang="en">English</a></span>
    <a class="contact" href="mailto:o_hyun2@naver.com"><span data-t="contact"></span> o_hyun2@naver.com</a></span></div>
  <p class="sub" data-t="sub"></p>
  <div class="grid">
    <form id="f" onsubmit="event.preventDefault()">
      <div class="fhead"><b data-t="filter"></b><button type="button" id="fold" aria-expanded="true" aria-controls="f"></button></div>
      <fieldset id="locbox"><legend data-t="loc"></legend><div class="seg" id="loc"></div></fieldset>
      <fieldset><legend data-t="type"></legend><div class="seg" id="type"></div></fieldset>
      <fieldset><legend data-t="year"></legend><div class="seg" id="year"></div></fieldset>
      <div><label class="lbl" for="ind" data-t="ind"></label><select id="ind"></select></div>
      <div><label class="lbl" for="job" data-t="job"></label><select id="job"></select></div>
      <div><label class="lbl" for="kw" data-t="kw"></label><input type="text" id="kw"></div>
      <fieldset><legend data-t="site"></legend><div class="seg" id="site"></div></fieldset>
      <div><label class="lbl" for="sort" data-t="sort"></label><select id="sort"></select></div>
    </form>
    <main>
      <div class="bar"><span id="count"></span><span id="fetched"></span></div>
      <p class="err" id="err" hidden></p>
      <ul class="jobs" id="out"></ul>
      <nav class="pager" id="pager"></nav>
    </main>
  </div>
</div>
<script>
// 언어: ?lang=en → 브라우저에 저장된 값 → 한국어
let LANG=new URLSearchParams(location.search).get("lang");
try{ if(LANG)localStorage.setItem("lang",LANG); else LANG=localStorage.getItem("lang"); }catch{}
if(LANG!=="en")LANG="ko";
const EN=LANG==="en";

const T={
  ko:{title:"한일 채용공고 모아보기",sub:"한국·일본 채용 사이트 8곳의 공고를 한 목록으로 보여 줘요.",contact:"문의사항",filter:"필터",fold:"접기",unfold:"펼치기",
    loc:"근무지",type:"채용 구분",year:"입사년도",ind:"업종",job:"직무",kw:"키워드 (회사명·제목)",kwPh:"예: 삼성, 商社, 일본어",site:"사이트",sort:"정렬",
    sortSite:"사이트 순",sortDl:"마감 임박순",all:"전체",loading:"불러오는 중…",count:n=>`공고 ${n}건`,fetched:d=>"마지막 수집 "+d.toLocaleString("ko"),
    err:s=>"일부 사이트를 못 불러왔어요: "+s,loadErr:m=>`공고 목록(jobs.json)을 불러오지 못했어요. (${m})`,empty:"조건에 맞는 공고가 없어요. 필터를 줄여 보세요.",
    yearLbl:y=>y+"년",start:(y,g)=>`${y}년 입사${g?" (추정)":""}`,guessTip:"제목에 연도가 없어 공고 시기로 추정했어요",pages:"페이지",prev:"이전 페이지",next:"다음 페이지",
    loc_:{kr:"한국",jp:"일본",ovs:"해외"},types:{new:"신입",intern:"인턴",exp:"경력",contract:"계약직"}},
  en:{title:"Japan Job Listings",sub:"New-grad jobs, internships and info sessions from Japanese job sites in one list. Updated every 6 hours.",contact:"Contact",filter:"Filters",fold:"Hide",unfold:"Show",
    loc:"Location",type:"Type",year:"Start year",ind:"Industry",job:"Job type",kw:"Keyword (company or title)",kwPh:"e.g. 商社, Sony, エンジニア",site:"Sites",sort:"Sort",
    sortSite:"By site",sortDl:"Deadline soonest",all:"All",loading:"Loading…",count:n=>`${n} listings`,fetched:d=>"Last updated "+d.toLocaleString("en"),
    err:s=>"Some sites could not be updated, showing earlier listings: "+s,loadErr:m=>`Could not load the listings (${m}).`,empty:"No listings match these filters. Try removing some.",
    yearLbl:y=>String(y),start:(y,g)=>`Start ${y}${g?" (est.)":""}`,guessTip:"No year in the title, estimated from the posting date",pages:"Pages",prev:"Previous page",next:"Next page",
    loc_:{kr:"Korea",jp:"Japan",ovs:"Overseas"},types:{new:"New grad",intern:"Internship / event",exp:"Mid-career",contract:"Contract"}},
}[LANG];

const NOW=new Date().getFullYear();
// 영어판은 일본 채용 사이트만
const SITES=EN?["リクナビ","キャリタス就活","外資就活"]:["잡코리아","자소설닷컴","링커리어","마이나비코리아","월드잡플러스","リクナビ","キャリタス就活","外資就活"];
const SITE_EN={"リクナビ":"Rikunabi","キャリタス就活":"Career-tasu","外資就活":"Gaishi Shukatsu"};
const siteName=s=>EN?SITE_EN[s]||s:s;
const LOC=[["all",T.all],["kr",T.loc_.kr],["jp",T.loc_.jp]];
const TYPE=[["all",T.all],...["new","intern","exp","contract"].map(k=>[k,T.types[k]])];
const YEAR=[["all",T.all],...[NOW,NOW+1,NOW+2,NOW+3].map(y=>[String(y),T.yearLbl(y)])];
// [값, 한국어 표시, 한국어 검색어, 일본어 검색어, 영어 표시]
const IND=[["","전체","","","All"],["it","IT·인터넷","IT","IT","IT / Internet"],["maker","제조·메이커","제조","メーカー","Manufacturing"],["trade","상사·무역","무역","商社","Trading"],["fin","금융·보험","금융","金融","Finance / Insurance"],["consult","컨설팅","컨설팅","コンサル","Consulting"],["media","광고·미디어","광고","広告","Advertising / Media"],["dist","유통·소매","유통","小売","Retail"],["travel","호텔·관광·항공","호텔","ホテル","Hotels / Travel"],["logi","물류","물류","物流","Logistics"],["game","게임·엔터","게임","ゲーム","Games / Entertainment"]];
const JOB=[["","전체","","","All"],["dev","개발·엔지니어","개발","エンジニア","Engineering"],["sales","영업","영업","営業","Sales"],["mkt","마케팅·기획","마케팅","マーケティング","Marketing / Planning"],["office","사무·인사","사무","事務","Office / HR"],["acct","재무·회계","회계","経理","Accounting"],["design","디자인","디자인","デザイン","Design"],["trans","통번역","통역","通訳","Interpreting"],["cs","서비스·CS","서비스","接客","Customer service"],["rnd","연구개발","연구","研究","R&D"]];

const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 정적 문구 채우기
document.documentElement.lang=LANG; document.title=T.title;
document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[el.dataset.t]);
document.querySelectorAll("[data-lang]").forEach(a=>{ if(a.dataset.lang===LANG)a.setAttribute("aria-current","true"); });
$("kw").placeholder=T.kwPh; $("count").textContent=T.loading; $("pager").setAttribute("aria-label",T.pages);
$("sort").innerHTML=`<option value="">${T.sortSite}</option><option value="dl">${T.sortDl}</option>`;
if(EN)$("locbox").hidden=true;

function seg(id,opts,def,multi){$(id).innerHTML=opts.map(([v,t])=>`<input type="${multi?"checkbox":"radio"}" name="${id}" id="${id}-${v}" value="${v}"${multi||v==def?" checked":""}><label for="${id}-${v}">${esc(t)}</label>`).join("")}
seg("loc",LOC,"all"); seg("type",TYPE,"all"); seg("year",YEAR,"all"); seg("site",SITES.map(s=>[s,siteName(s)]),null,true);
$("ind").innerHTML=IND.map(r=>`<option value="${r[0]}">${esc(EN?r[4]:r[1])}</option>`).join("");
$("job").innerHTML=JOB.map(r=>`<option value="${r[0]}">${esc(EN?r[4]:r[1])}</option>`).join("");
const pick=n=>document.querySelector(`input[name=${n}]:checked`).value;
const row=(list,v)=>list.find(x=>x[0]==v);

let jobs=[], list=[], page=1;
const PER=20;

async function load(){
  try{
    const r=await fetch("jobs.json",{cache:"no-cache"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    jobs=d.jobs.filter(j=>SITES.includes(j.site)&&(!EN||j.loc==="jp"));
    $("fetched").textContent=T.fetched(new Date(d.fetched));
    // 오류 문구는 "사이트명: 내용" 형식. 영어판은 해당 사이트 이름만 보여 줌
    const errs=d.errors.filter(e=>SITES.includes(e.split(":")[0]));
    $("err").hidden=!errs.length;
    $("err").textContent=T.err(EN?errs.map(e=>siteName(e.split(":")[0])).join(", "):errs.join(" / "));
  }catch(e){ $("err").hidden=false; $("err").textContent=T.loadErr(e.message); }
  render();
}

// 업종·직무는 제목·회사·업종 태그에 한국어나 일본어 단어가 들어 있는지로 거름
function matchWords(j,words){ if(!words.length)return true; const s=(j.title+" "+j.company+" "+(j.tags||"")).toLowerCase(); return words.some(w=>s.includes(w.toLowerCase())); }
// 입사년도는 scrape.js가 계산한 j.year. 제목에 연도가 없으면 추정값(j.yearGuess)
function matchYear(j,y){ return y=="all"||j.year==y; }

function render(){
  const loc=EN?"all":pick("loc"), type=pick("type"), year=pick("year"), kw=$("kw").value.trim().toLowerCase();
  const sites=new Set([...document.querySelectorAll("input[name=site]:checked")].map(i=>i.value));
  const ind=row(IND,$("ind").value), job=row(JOB,$("job").value);
  page=1;
  list=jobs.filter(j=>sites.has(j.site)&&(loc=="all"||j.loc==loc)&&(type=="all"||j.types.includes(type))&&matchYear(j,year)
    &&(!kw||(j.title+" "+j.company+" "+(j.tags||"")).toLowerCase().includes(kw))
    &&matchWords(j,[ind[2],ind[3]].filter(Boolean))&&matchWords(j,[job[2],job[3]].filter(Boolean)));
  if($("sort").value=="dl")list=[...list].sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999"));
  $("count").textContent=T.count(list.length);
  show();
}

function show(){
  const pages=Math.max(1,Math.ceil(list.length/PER));
  $("out").innerHTML=list.length?list.slice((page-1)*PER,page*PER).map(j=>`<li class="job">
    <div class="meta">${EN?"":`<span class="tag ${j.loc}">${T.loc_[j.loc]}</span>`}<span class="tag">${esc(siteName(j.site))}</span>${j.types.map(t=>`<span class="tag">${T.types[t]}</span>`).join("")}${j.year?`<span class="tag"${j.yearGuess?` title="${T.guessTip}"`:""}>${T.start(j.year,j.yearGuess)}</span>`:""}${j.deadline?`<span class="tag dl">~${esc(j.deadline)}</span>`:""}</div>
    <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
    <div class="meta">${[j.company,j.location,j.career,j.tags].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div></li>`).join("")
    :`<li class="empty">${T.empty}</li>`;
  // 현재 페이지 앞뒤 2쪽 + 처음·끝 쪽만 번호로 보여 줌
  const nums=[...new Set([1,page-2,page-1,page,page+1,page+2,pages])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
  const btn=(n,t,dis)=>`<button type="button" data-p="${n}"${dis?" disabled":""}${n==page&&!t?' aria-current="page"':""}${t?` aria-label="${t=="‹"?T.prev:T.next}"`:""}>${t||n}</button>`;
  $("pager").innerHTML=pages<2?"":btn(page-1,"‹",page==1)
    +nums.map((n,i)=>(i&&n-nums[i-1]>1?"<span>…</span>":"")+btn(n)).join("")
    +btn(page+1,"›",page==pages);
}

$("pager").addEventListener("click",e=>{const p=e.target.closest("button")?.dataset.p; if(!p)return; page=+p; show(); $("count").scrollIntoView({behavior:"smooth"});});
$("f").addEventListener("input",render);

// 필터 칸 높이를 지금 화면에 보이는 영역에 맞춤 (페이지를 내리기 전에도 아래쪽이 잘리지 않게)
function fitFilter(){ const f=$("f"); f.style.maxHeight=(innerHeight-Math.max(12,f.getBoundingClientRect().top)-12)+"px"; }
addEventListener("scroll",fitFilter,{passive:true}); addEventListener("resize",fitFilter); fitFilter();

// 필터 접기/펼치기 (브라우저에 기억)
function setFold(on){ $("f").classList.toggle("folded",on); document.querySelector(".grid").classList.toggle("folded",on); $("fold").textContent=on?T.unfold:T.fold; $("fold").setAttribute("aria-expanded",!on); fitFilter(); }
$("fold").addEventListener("click",()=>{ const on=!$("f").classList.contains("folded"); setFold(on); try{localStorage.setItem("filterFolded",on?"1":"")}catch{} });
setFold(false);
try{ if(localStorage.getItem("filterFolded"))setFold(true); }catch{}
load();
</script>
</body>
</html>
